services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-controlplane}
      POSTGRES_USER: ${POSTGRES_USER:-controlplane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-controlplane}
    ports:
      - "5432:5432"
    volumes:
      - controlplane-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build: ./apps/api
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      DATABASE_URL: postgresql+psycopg://controlplane:controlplane@postgres:5432/controlplane
      REDIS_URL: redis://redis:6379/0
      API_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
volumes:
  controlplane-postgres:
